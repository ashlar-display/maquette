[package]
name = "maquette"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A simulated HDMI sink for tests: SCDC and EDID registers, a DDC bus, a PHY and a clock under deterministic time, with faults and conformance checks for hdmi-hal's traits"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/ashlar-display/maquette"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "no-std", "simulation", "testing"]
categories = ["development-tools::testing", "embedded", "hardware-support", "no-std", "no-std::no-alloc"]
include = ["src/**", "doc/**", "README.md", "CHANGELOG.md", "LICENSE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[features]
std = ["critical-section/std"]
async = ["dep:hdmi-hal-async"]

[dependencies]
hdmi-hal = { version = "0.7", default-features = false }
hdmi-hal-async = { version = "0.4", default-features = false, optional = true }
critical-section = "1.2"

[dev-dependencies]
# The tests run on a host, which needs a critical-section implementation with every
# feature set; a bare-target build of the library does not see this.
critical-section = { version = "1.2", features = ["std"] }
# Drives the async checks' futures in tests.
pollster = "1.0"
