[package]
name = "maquette"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A simulated HDMI sink for tests: SCDC and EDID registers, a DDC bus, a PHY and a clock under deterministic time, with faults and conformance checks for hdmi-hal's traits"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/ashlar-display/maquette"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "no-std", "simulation", "testing"]
categories = ["development-tools::testing", "embedded", "hardware-support", "no-std", "no-std::no-alloc"]
include = ["src/**", "doc/**", "README.md", "CHANGELOG.md", "LICENSE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[features]
std = ["critical-section/std"]
async = ["dep:hdmi-hal-async"]

[dependencies]
hdmi-hal = { version = "0.6", default-features = false }
hdmi-hal-async = { version = "0.3", default-features = false, optional = true }
critical-section = "1.2"

[dev-dependencies]
# The tests run on a host, which needs a critical-section implementation with every
# feature set; a bare-target build of the library does not see this.
critical-section = { version = "1.2", features = ["std"] }
# Drives the async checks' futures in tests.
pollster = "0.4"

# Prototype against hdmi-hal's unreleased breaking release: pushed commits of hdmi-hal's
# and hdmi-hal-async's feat/tmds-phy branches, moved by hand. Removed when they are
# released, and the requirements above raised to those releases with it: the published
# versions the requirements match today have no `DdcBus` or `TmdsPhy`. CI on main and the
# publish workflow fail while it is here.
[patch.crates-io]
hdmi-hal = { git = "https://github.com/ashlar-display/hdmi-hal", rev = "ee13fc9c8faee2ec491275dd76d493ac67627e28" }
hdmi-hal-async = { git = "https://github.com/ashlar-display/hdmi-hal-async", rev = "38d0c38e6585b5e3b642d1e419d618d7192bc0f9" }
